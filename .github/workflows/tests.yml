#
# Why this exists
# ---------------
# Six tests sat red for days in August 2026 because nothing ran the suite unless a
# person chose to. They were not subtle failures -- the corpus doc had gone stale
# after a source was added, and the guard that exists to catch exactly that had
# caught it, and reported to no one.
#
# What this can and cannot check
# ------------------------------
# `artifacts/` is gitignored: checkpoints, converted HF directories, token arrays
# and the 1.6 GB corpus are not in a clone. So this job runs the ~1592 tests that
# need none of them and SKIPS ~81 that do (both counts drift as the suite grows --
# read the actual run's summary line, not this comment, for the current numbers).
# The run prints that split every time (see tests/conftest.py) rather than letting
# a green tick imply more than it means.
#
# No hardware, no network, no Tenstorrent card. Anything needing a device is a
# separate, manual concern -- the device gates in this repo take a gozer lease and
# have no business in CI.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU build)
        # The CPU wheel is ~200 MB against ~2.5 GB for the default CUDA one, and
        # nothing here runs on a GPU. Installed first so the resolver cannot pull
        # the CUDA build in as a transitive dependency of transformers.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        # Measured, not guessed: with the list below (plus the nltk data step following
        # this one) a fresh checkout is 1592 passed, 81 skipped, 0 failed -- verified in a
        # bare clone (no artifacts/), not this box's own environment, which has local
        # artifacts and optional installs this job must not rely on.
        #
        # `ttnn` is Tenstorrent's own PyPI package and imports fine with no card
        # present. `ttml` (tt-train) is NOT on PyPI; tests needing it already skip.
        # Versions are deliberately unpinned: if an upstream release breaks us, that
        # is a thing worth being told about rather than insulated from.
        #
        # `nltk` backs train/content_add.py's content-word gate (pyproject.toml's
        # `content` extra). That module's own tests deliberately skip nothing and fail
        # loudly if the gate cannot run -- "the right behaviour for the module that
        # decides the training vocabulary" (pyproject.toml). This job went red because
        # that design was correct and this install step was never updated alongside it
        # when the content-word gate landed; the fix belongs here, not in the tests.
        run: pip install pytest numpy pyyaml ml_dtypes ttnn transformers tokenizers datasets nltk

      - name: Download nltk tagger data
        # train/content_add.py needs both packages at runtime, not just import-time
        # presence of the `nltk` module -- see its _require_nltk() and the pyproject.toml
        # comment on the `content` extra for the exact two package names.
        run: python -m nltk.downloader averaged_perceptron_tagger_eng punkt_tab

      - name: Run the offline suite
        # -rs prints the reason for every skip, so "N skipped" is auditable rather
        # than a number to scroll past.
        run: pytest -q -rs
