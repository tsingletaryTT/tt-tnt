[project]
name = "tt-tnt"
version = "0.1.0"
description = "TT-TNT — a Tenstorrent-first model, trained, packaged, and served on TT tooling"
requires-python = ">=3.10"
dependencies = [
    "tokenizers>=0.21",
    "transformers>=4.52",
    "huggingface_hub>=0.36",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# The content-word gate on the `add` slot (train/content_add.py, --content-add). Optional
# because nothing else in the tree needs a tagger and a bare checkout must still run pytest:
# `train.content_add` imports nltk lazily through `importlib.util.find_spec`, and
# `tests/test_content_add.py` skips nothing -- it fails loudly if the gate cannot run, which
# is the right behaviour for the module that decides the training vocabulary.
# Needs the tagger data too:
#   python -m nltk.downloader averaged_perceptron_tagger_eng punkt_tab
content = ["nltk>=3.9"]
# app.py, the Gradio demo. Optional because nothing else in the tree needs a UI
# toolkit and a bare checkout must still run pytest with no extras installed.
# The starlette pin is load-bearing, not decoration: gradio 4.44's routes.py calls
# the OLD-style `Jinja2Templates.TemplateResponse(name, context)` (no `request` as
# first arg). Starlette kept a deprecated back-compat shim for that call shape all
# through its 0.x line (checked directly through 0.52.1, the last 0.x release) and
# deleted it at the 1.0.0 major bump, which fastapi's own `starlette>=0.46.0` (no
# upper bound) happily resolves to on a fresh/shared install -- producing a runtime
# `TypeError: unhashable type: 'dict'` on every page load with no import-time error
# to catch it earlier. `<1.0` keeps pip on a 0.x release that still has the shim.
# `torch` belongs here, not in the base dependencies: demo_hf_backend.py (the "CPU
# direct" generation path app.py's Gradio UI calls) imports it lazily at call time,
# so its absence didn't fail at import -- it surfaced as a caught exception,
# "ERROR generating with <checkpoint> (production): No module named 'torch'", on
# the first click. requirements.txt (the separate HF Spaces runtime pin) already
# had torch>=2.0.0; this was a real gap between the two dependency declarations,
# not a Spaces-only requirement.
#
# Same shape of bug as the starlette pin above, one dependency over: gradio 4.44's
# oauth.py does `from huggingface_hub import HfFolder, whoami` -- HfFolder is a
# legacy API huggingface_hub removed at its own 1.0.0 major bump (checked: still
# present through 0.36.2, gone by 1.30.0). The base `huggingface_hub>=0.36` has no
# upper bound, so an unconstrained `pip install -e ".[ui]"` resolves straight to
# the newest 1.x and gradio fails at import with
# `ImportError: cannot import name 'HfFolder' from 'huggingface_hub'`. Pinning
# `<1.0` here (combined with the base floor) keeps the resolver on the newest
# compatible 0.x release for this extra only, without lowering the floor for
# non-UI consumers (train/eval scripts, tests) that don't hit gradio's oauth.py.
ui = ["gradio>=4.44,<5", "starlette<1.0", "torch>=2.0.0", "huggingface_hub<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `train`, `convert` and `scripts` import from a BARE CHECKOUT
# with nothing installed. Every local run had these on sys.path via an editable
# install of the project under its pre-rename name (tt-nanollama3), which meant
# local green said nothing about a fresh clone -- CI's first run failed on
# `ModuleNotFoundError: No module named 'convert'` while the same command passed
# here. Not `pip install -e .` in the workflow: this repo is not a library, and a
# contributor with a fresh clone should be able to run pytest.
pythonpath = ["."]

[tool.setuptools.packages.find]
# Discovery by pattern, not an explicit list: Task 1 ships only `train/`, and
# `convert/` arrives in Task 2. An explicit `packages = ["train", "convert"]` makes
# `pip install -e .` fail until Task 2 lands, and bare flat-layout auto-discovery
# fails the other way once it does ("Multiple top-level packages discovered in a
# flat-layout"). Include patterns match whatever exists, in both states.
include = ["train*", "convert*"]
