#
# tt-model-manager v5.1 CONTAINER package for tt-tnt.
#
#   tt-model package --container tt-model.yaml
#   tt-model serve episod/tt-tnt
#
# This is an LLM served via stock vLLM + the standalone vllm-tt-plugin (no fork, no
# in-tree plugin) -- kind: vllm-plugin.

schema: "5.1"
repo: episod/tt-tnt
name: tt-tnt
# Weights are collocated with the code in the same repo (episod/tt-tnt) -- a pointer,
# never baked into the image; `pull` fetches them separately to the host HF cache.
weights: episod/tt-tnt
kind: vllm-plugin
arch: blackhole

image:
  registry: hf

source:
  # Pinned to the v0.77.0 TAG, not a branch -- this is the exact tt-metal/ttnn version
  # tt-tnt's checkpoints were trained/served against (ttnn==0.77.0). A worktree at the
  # tag, not the box's main tt-metal checkout (which floats ahead of it).
  tt_metal: /tmp/claude-1000/-home-ttuser-code-tt-kernel-package-manager/f2e66ac7-be1f-49ca-86cd-8845fa483f06/scratchpad/tt-metal-v0770
  code:
    # tt_tnt_adapter.py imports models.tt_transformers.tt.{model_config,generator_vllm}
    # directly, and generator.py pulls in models.common.sampling for the TT sampling
    # path. Both directories are small (~1MB / ~4MB) -- shipped whole rather than
    # cherry-picked, which also means models/tt_transformers/tt/prefetcher/
    # prefetcher_config.yaml (opened unconditionally at import time, no error if
    # missing beyond a bare FileNotFoundError) rides along automatically instead of
    # needing its own allowlist entry.
    - models/common
    - models/tt_transformers/tt
  # The adapter itself does NOT live in tt-metal -- it is this repo's own bundle/ dir,
  # restructured into the per-model subfolder EXTRA_MODELS_DIR convention (the plugin
  # scans extra_models_dir's CHILDREN for vllm_metadata.json).
  extra_code:
    - root:
        repo: https://github.com/tsingletaryTT/tt-tnt
        ref: __TT_TNT_REF__
      paths:
        - bundle
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # Stock upstream vLLM, built empty-target in the image (VLLM_TARGET_DEVICE=empty) --
  # matches the vllm-tt-plugin version this ref actually requires.
  vllm: {version: "0.26.0"}
  # Pinned to vllm-tt-plugin's current main (a real, pushed commit) rather than the
  # older 6d3bb28/vLLM-0.25.1 combo already proven earlier today -- deliberately testing
  # the newer plugin fresh, per explicit direction. NOT verified against tt-tnt before
  # this build.
  plugin:
    repo: https://github.com/tenstorrent/vllm-tt-plugin
    ref: f1593cbbf577330dfa839918d9d413c39050e667
  extra_models_dir: bundle

serve:
  port: 8000
  hardware: p150
  mesh_device: P150
  max_num_seqs: 32   # matches the v5 fat bundle already hardware-verified today
  block_size: 64      # required -- the TT backend rejects vLLM's default

verify:
  - "from models.tt_transformers.tt.generator_vllm import LlamaForCausalLM as m; assert m"
  - "from pathlib import Path; p = Path('/opt/tt-metal/models/tt_transformers/tt/prefetcher/prefetcher_config.yaml'); assert p.is_file(), 'prefetcher.py opens this unconditionally at import time with no fallback'"

card:
  description: >
    A ~22M-parameter Llama-3-style language model trained from random initialization on
    Tenstorrent Blackhole hardware with ttml (tt-train), then converted to Hugging Face
    format and numerically verified. A demonstration that a model can be designed,
    trained, packaged, and served entirely on Tenstorrent tooling -- not a capable model.
